name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: npm test
      - name: Lint the extension
        run: npx --yes web-ext lint --source-dir . --ignore-files 'dist/**' 'test/**' 'tools/**'
